<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>发光格子生成器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    color: #e0e0e0;
    font-family: "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    height: 100vh;
    overflow: hidden;
  }

  #canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    display: block;
  }

  /* 收起/展开按钮 */
  .toggle-btn {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 1001;
    width: 40px;
    height: 40px;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px;
    background: rgba(18,18,26,0.85);
    color: #ccc;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
    backdrop-filter: blur(8px);
  }
  .toggle-btn:hover {
    background: rgba(99,102,241,0.3);
    border-color: #6366f1;
    color: #fff;
  }

  /* 控制面板 - 右侧浮层，只占内容高度 */
  .control-panel {
    position: fixed;
    top: 0;
    right: 0;
    width: 300px;
    max-height: 100vh;
    background: rgba(18,18,26,0.92);
    backdrop-filter: blur(12px);
    border-left: 1px solid rgba(255,255,255,0.08);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    border-radius: 0 0 0 12px;
    padding: 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    z-index: 1000;
    transform: translateX(0);
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .control-panel.collapsed {
    transform: translateX(100%);
  }

  .panel-title {
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    padding-bottom: 10px;
    border-bottom: 1px solid #2a2a3a;
  }

  .param-group {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .param-item {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .param-label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: #aaa;
  }

  .param-value {
    font-family: "Cascadia Code", "Fira Code", monospace;
    color: #6366f1;
    font-weight: 600;
    font-size: 13px;
  }

  input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 5px;
    border-radius: 3px;
    background: #1e1e2e;
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #6366f1;
    cursor: pointer;
    box-shadow: 0 0 6px rgba(99,102,241,0.5);
    transition: transform 0.15s;
  }
  input[type="range"]::-webkit-slider-thumb:hover {
    transform: scale(1.2);
  }
  input[type="range"]::-webkit-slider-thumb:active {
    background: #818cf8;
  }

  .direction-group {
    display: flex;
    gap: 6px;
  }
  .direction-btn {
    flex: 1;
    padding: 6px 0;
    border: 1px solid #2a2a3a;
    border-radius: 5px;
    background: #1a1a24;
    color: #888;
    font-size: 11px;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
  }
  .direction-btn:hover {
    border-color: #6366f1;
    color: #bbb;
  }
  .direction-btn.active {
    background: #6366f1;
    color: #fff;
    border-color: #6366f1;
    box-shadow: 0 0 10px rgba(99,102,241,0.3);
  }

  .divider {
    height: 1px;
    background: #1e1e2a;
  }

  .save-section {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .save-btn {
    padding: 10px 0;
    border: none;
    border-radius: 7px;
    background: linear-gradient(135deg, #6366f1, #a855f7);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .save-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(99,102,241,0.4);
  }
  .save-btn:active {
    transform: translateY(0);
  }

  .preset-group {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .preset-btn {
    padding: 5px 10px;
    border: 1px solid #2a2a3a;
    border-radius: 5px;
    background: #1a1a24;
    color: #999;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .preset-btn:hover {
    border-color: #6366f1;
    color: #ccc;
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<button class="toggle-btn" id="toggleBtn" title="收起/展开面板">☰</button>

<div class="control-panel" id="panel">
  <div class="panel-title">发光格子生成器【老黑】</div>

  <div>
    <div class="param-label" style="margin-bottom:6px"><span>快速预设</span></div>
    <div class="preset-group">
      <button class="preset-btn" data-preset="fine">细密格子</button>
      <button class="preset-btn" data-preset="medium">标准格子</button>
      <button class="preset-btn" data-preset="large">大格子</button>
      <button class="preset-btn" data-preset="glow">强发光</button>
    </div>
  </div>

  <div class="divider"></div>

  <div class="param-group">
    <div class="param-item">
      <div class="param-label">
        <span>格子大小</span>
        <span class="param-value" id="val-gridSize">240</span>
      </div>
      <input type="range" id="gridSize" min="40" max="600" value="240" step="1">
    </div>
    <div class="param-item">
      <div class="param-label">
        <span>发光强度</span>
        <span class="param-value" id="val-glowStrength">8</span>
      </div>
      <input type="range" id="glowStrength" min="0" max="30" value="8" step="1">
    </div>
    <div class="param-item">
      <div class="param-label">
        <span>线条透明度</span>
        <span class="param-value" id="val-lineAlpha">0.45</span>
      </div>
      <input type="range" id="lineAlpha" min="0.05" max="1" value="0.45" step="0.01">
    </div>
    <div class="param-item">
      <div class="param-label">
        <span>光晕透明度</span>
        <span class="param-value" id="val-glowAlpha">0.20</span>
      </div>
      <input type="range" id="glowAlpha" min="0.02" max="0.6" value="0.20" step="0.01">
    </div>
    <div class="param-item">
      <div class="param-label">
        <span>线条宽度</span>
        <span class="param-value" id="val-lineWidth">1.0</span>
      </div>
      <input type="range" id="lineWidth" min="0.5" max="4" value="1" step="0.1">
    </div>
    <div class="param-item">
      <div class="param-label">
        <span>运动速度</span>
        <span class="param-value" id="val-speed">1.0x</span>
      </div>
      <input type="range" id="speed" min="0.2" max="4" value="1" step="0.1">
    </div>
    <div class="param-item">
      <div class="param-label">
        <span>交叉点大小</span>
        <span class="param-value" id="val-dotRadius">2.0</span>
      </div>
      <input type="range" id="dotRadius" min="0" max="6" value="2" step="0.1">
    </div>
  </div>

  <div class="param-item">
    <div class="param-label"><span>运动方向</span></div>
    <div class="direction-group">
      <button class="direction-btn" data-dir="up">↑ 上</button>
      <button class="direction-btn active" data-dir="down">↓ 下</button>
      <button class="direction-btn" data-dir="left">← 左</button>
      <button class="direction-btn" data-dir="right">→ 右</button>
    </div>
  </div>

  <div class="divider"></div>

  <button class="save-btn" id="saveBtn">保存图片</button>
</div>

<script>
// ── 参数 ──
const params = {
  gridSize: 240,
  glowStrength: 8,
  lineAlpha: 0.45,
  glowAlpha: 0.20,
  lineWidth: 1,
  speed: 1,
  dotRadius: 2,
  direction: 'down',
};

// ── Canvas 全屏 ──
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let animFrame = null;
let frameCount = 0;

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function renderFrame(targetCtx, w, h, frame) {
  const { gridSize, glowStrength, lineAlpha, glowAlpha, lineWidth, speed, dotRadius, direction } = params;

  targetCtx.fillStyle = '#000';
  targetCtx.fillRect(0, 0, w, h);

  const cycleFrames = Math.max(1, Math.round(gridSize / speed));
  const offset = (frame % cycleFrames) * speed;

  // 初始偏移：让第一条纵线移出画面左侧（半个格子宽度）
  const padX = gridSize / 2;

  let offX = -padX, offY = 0;
  if (direction === 'up') offY = -offset;
  else if (direction === 'down') offY = offset;
  else if (direction === 'left') offX = -padX - offset;
  else if (direction === 'right') offX = -padX + offset;

  const cols = Math.ceil(w / gridSize) + 3;
  const rows = Math.ceil(h / gridSize) + 3;

  if (glowStrength > 0) {
    targetCtx.save();
    targetCtx.shadowColor = `rgba(255,255,255,${glowAlpha})`;
    targetCtx.shadowBlur = glowStrength;
    targetCtx.strokeStyle = `rgba(255,255,255,${glowAlpha})`;
    targetCtx.lineWidth = lineWidth + 2;
    for (let i = -1; i < cols; i++) {
      const x = i * gridSize + offX;
      targetCtx.beginPath(); targetCtx.moveTo(x, 0); targetCtx.lineTo(x, h); targetCtx.stroke();
    }
    for (let j = -1; j < rows; j++) {
      const y = j * gridSize + offY;
      targetCtx.beginPath(); targetCtx.moveTo(0, y); targetCtx.lineTo(w, y); targetCtx.stroke();
    }
    targetCtx.restore();
  }

  targetCtx.strokeStyle = `rgba(255,255,255,${lineAlpha})`;
  targetCtx.lineWidth = lineWidth;
  for (let i = -1; i < cols; i++) {
    const x = i * gridSize + offX;
    targetCtx.beginPath(); targetCtx.moveTo(x, 0); targetCtx.lineTo(x, h); targetCtx.stroke();
  }
  for (let j = -1; j < rows; j++) {
    const y = j * gridSize + offY;
    targetCtx.beginPath(); targetCtx.moveTo(0, y); targetCtx.lineTo(w, y); targetCtx.stroke();
  }

  if (dotRadius > 0) {
    targetCtx.fillStyle = `rgba(255,255,255,${Math.min(1, lineAlpha + 0.2)})`;
    for (let i = -1; i < cols; i++) {
      for (let j = -1; j < rows; j++) {
        const cx = i * gridSize + offX;
        const cy = j * gridSize + offY;
        if (cx > -gridSize && cx < w + gridSize && cy > -gridSize && cy < h + gridSize) {
          targetCtx.beginPath(); targetCtx.arc(cx, cy, dotRadius, 0, Math.PI * 2); targetCtx.fill();
        }
      }
    }
  }
}

function animate() {
  renderFrame(ctx, canvas.width, canvas.height, frameCount);
  frameCount++;
  animFrame = requestAnimationFrame(animate);
}

// ── 面板收起/展开 ──
const panel = document.getElementById('panel');
const toggleBtn = document.getElementById('toggleBtn');
let panelOpen = true;

toggleBtn.addEventListener('click', () => {
  panelOpen = !panelOpen;
  panel.classList.toggle('collapsed', !panelOpen);
  toggleBtn.textContent = panelOpen ? '✕' : '☰';
});

// ── 控件绑定 ──
const sliderIds = ['gridSize', 'glowStrength', 'lineAlpha', 'glowAlpha', 'lineWidth', 'speed', 'dotRadius'];
sliderIds.forEach(id => {
  const slider = document.getElementById(id);
  const valEl = document.getElementById('val-' + id);
  slider.addEventListener('input', () => {
    const v = parseFloat(slider.value);
    params[id] = v;
    if (id === 'speed') valEl.textContent = v.toFixed(1) + 'x';
    else if (id === 'gridSize' || id === 'glowStrength') valEl.textContent = v;
    else if (id === 'lineWidth' || id === 'dotRadius') valEl.textContent = v.toFixed(1);
    else valEl.textContent = v.toFixed(2);
  });
});

document.querySelectorAll('.direction-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.direction-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    params.direction = btn.dataset.dir;
  });
});

const presets = {
  fine:   { gridSize: 60,  glowStrength: 4,  lineAlpha: 0.35, glowAlpha: 0.15, lineWidth: 0.5, speed: 0.8, dotRadius: 1 },
  medium: { gridSize: 160, glowStrength: 6,  lineAlpha: 0.45, glowAlpha: 0.20, lineWidth: 1,   speed: 1,   dotRadius: 2 },
  large:  { gridSize: 360, glowStrength: 10, lineAlpha: 0.50, glowAlpha: 0.25, lineWidth: 1.5, speed: 1.5, dotRadius: 3 },
  glow:   { gridSize: 200, glowStrength: 20, lineAlpha: 0.30, glowAlpha: 0.45, lineWidth: 1,   speed: 0.6, dotRadius: 2.5 },
};
document.querySelectorAll('.preset-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const p = presets[btn.dataset.preset];
    Object.assign(params, p);
    sliderIds.forEach(id => {
      const slider = document.getElementById(id);
      const valEl = document.getElementById('val-' + id);
      slider.value = params[id];
      if (id === 'speed') valEl.textContent = params[id].toFixed(1) + 'x';
      else if (id === 'gridSize' || id === 'glowStrength') valEl.textContent = params[id];
      else if (id === 'lineWidth' || id === 'dotRadius') valEl.textContent = params[id].toFixed(1);
      else valEl.textContent = params[id].toFixed(2);
    });
  });
});

// ── 保存图片（弹出另存为对话框）──
document.getElementById('saveBtn').addEventListener('click', async () => {
  const W = canvas.width;
  const H = canvas.height;

  const offCanvas = document.createElement('canvas');
  offCanvas.width = W;
  offCanvas.height = H;
  const offCtx = offCanvas.getContext('2d');
  offCtx.drawImage(canvas, 0, 0);

  const blob = await new Promise(resolve => offCanvas.toBlob(resolve, 'image/png'));

  // 尝试使用系统另存为对话框
  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: `glow-grid-${W}x${H}.png`,
        types: [{
          description: 'PNG 图片',
          accept: { 'image/png': ['.png'] }
        }]
      });
      const writable = await handle.createWritable();
      await writable.write(blob);
      await writable.close();
    } catch (e) {
      if (e.name !== 'AbortError') console.error(e);
    }
  } else {
    // 回退：直接下载
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `glow-grid-${W}x${H}.png`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }
});

// ── 启动 ──
animate();
</script>

</body>
</html>
