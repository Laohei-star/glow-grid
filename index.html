<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>发光格子生成器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    color: #e0e0e0;
    font-family: "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    height: 100vh;
    overflow: hidden;
  }

  #canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    display: block;
  }

  /* 收起/展开按钮 */
  .toggle-btn {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 1001;
    width: 40px;
    height: 40px;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 8px;
    background: rgba(18,18,26,0.85);
    color: #ccc;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
    backdrop-filter: blur(8px);
  }
  .toggle-btn:hover {
    background: rgba(99,102,241,0.3);
    border-color: #6366f1;
    color: #fff;
  }

  /* 控制面板 - 右侧浮层，只占内容高度 */
  .control-panel {
    position: fixed;
    top: 0;
    right: 0;
    width: 300px;
    max-height: 100vh;
    background: rgba(18,18,26,0.92);
    backdrop-filter: blur(12px);
    border-left: 1px solid rgba(255,255,255,0.08);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    border-radius: 0 0 0 12px;
    padding: 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    z-index: 1000;
    transform: translateX(0);
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .control-panel.collapsed {
    transform: translateX(100%);
  }

  .panel-title {
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    padding-bottom: 10px;
    border-bottom: 1px solid #2a2a3a;
  }

  .param-group {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .param-item {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .param-label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: #aaa;
  }

  .param-value {
    font-family: "Cascadia Code", "Fira Code", monospace;
    color: #6366f1;
    font-weight: 600;
    font-size: 13px;
  }

  input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 5px;
    border-radius: 3px;
    background: #1e1e2e;
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #6366f1;
    cursor: pointer;
    box-shadow: 0 0 6px rgba(99,102,241,0.5);
    transition: transform 0.15s;
  }
  input[type="range"]::-webkit-slider-thumb:hover {
    transform: scale(1.2);
  }
  input[type="range"]::-webkit-slider-thumb:active {
    background: #818cf8;
  }

  .direction-group {
    display: flex;
    gap: 6px;
  }
  .direction-btn {
    flex: 1;
    padding: 6px 0;
    border: 1px solid #2a2a3a;
    border-radius: 5px;
    background: #1a1a24;
    color: #888;
    font-size: 11px;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
  }
  .direction-btn:hover {
    border-color: #6366f1;
    color: #bbb;
  }
  .direction-btn.active {
    background: #6366f1;
    color: #fff;
    border-color: #6366f1;
    box-shadow: 0 0 10px rgba(99,102,241,0.3);
  }

  .divider {
    height: 1px;
    background: #1e1e2a;
  }

  .save-section {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .save-btn {
    padding: 10px 0;
    border: none;
    border-radius: 7px;
    background: linear-gradient(135deg, #6366f1, #a855f7);
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .save-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(99,102,241,0.4);
  }
  .save-btn:active {
    transform: translateY(0);
  }

  .preset-group {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .preset-btn {
    padding: 5px 10px;
    border: 1px solid #2a2a3a;
    border-radius: 5px;
    background: #1a1a24;
    color: #999;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .preset-btn:hover {
    border-color: #6366f1;
    color: #ccc;
  }

  /* 颜色选择器 */
  .color-row {
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .color-pick {
    display: flex;
    align-items: center;
    gap: 6px;
    flex: 1;
  }
  .color-pick label {
    font-size: 12px;
    color: #aaa;
    white-space: nowrap;
  }
  .color-pick input[type="color"] {
    -webkit-appearance: none;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 6px;
    width: 32px;
    height: 26px;
    padding: 1px;
    background: transparent;
    cursor: pointer;
  }
  .color-pick input[type="color"]::-webkit-color-swatch-wrapper {
    padding: 2px;
  }
  .color-pick input[type="color"]::-webkit-color-swatch {
    border: none;
    border-radius: 3px;
  }

  /* 文字输入控件 */
  .text-input { width: 100%; padding: 8px 10px; background: #1a1a24; border: 1px solid #2a2a3a; border-radius: 5px; color: #e8ecff; font-size: 13px; outline: none; font-family: inherit; }
  .text-input:focus { border-color: #6366f1; }
  textarea.text-input { resize: vertical; min-height: 50px; }
  .font-file-btn { display: inline-block; padding: 6px 10px; background: #1a1a24; border: 1px solid #2a2a3a; border-radius: 5px; color: #aaa; font-size: 11px; cursor: pointer; margin-top: 4px; }
  .font-file-btn:hover { border-color: #6366f1; color: #ccc; }
  .checkbox-row { display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 12px; color: #aaa; }
  .checkbox-row input[type="checkbox"] { accent-color: #6366f1; width: 14px; height: 14px; }

  /* 底部引流链接 */
  .bottom-links {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 999;
    padding: 8px 16px;
    background: rgba(18,18,26,0.75);
    backdrop-filter: blur(10px);
    border-radius: 28px;
    border: 1px solid rgba(255,255,255,0.08);
    transition: opacity 0.35s, transform 0.35s;
  }
  .bottom-links.hidden {
    opacity: 0;
    transform: translateX(-50%) translateY(20px);
    pointer-events: none;
  }
  .link-icon {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    transition: all 0.25s;
    cursor: pointer;
    text-decoration: none;
    color: #aaa;
  }
  .link-icon:hover {
    background: rgba(99,102,241,0.25);
    border-color: #6366f1;
    transform: translateY(-2px);
    color: #fff;
  }
  .link-icon svg {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: #aaa;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
    transition: stroke 0.25s;
  }
  .link-icon:hover svg {
    stroke: #fff;
  }
  .link-icon.arrow-btn svg {
    width: 14px;
    height: 14px;
    stroke-width: 2;
  }
  .link-icon.h-letter {
    font-size: 15px;
    font-weight: 700;
    font-family: Arial, sans-serif;
    line-height: 1;
  }

  /* 展开按钮（收起后显示）*/
  .bottom-expand {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    z-index: 998;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(18,18,26,0.6);
    border: 1px solid rgba(255,255,255,0.08);
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: all 0.35s;
  }
  .bottom-expand.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
    pointer-events: auto;
  }
  .bottom-expand svg {
    width: 14px;
    height: 14px;
    stroke: #888;
    stroke-width: 2;
    fill: none;
  }
  .bottom-expand:hover svg {
    stroke: #fff;
  }

  /* 公众号弹窗 */
  .info-modal {
    position: fixed;
    inset: 0;
    z-index: 2000;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
  }
  .info-modal.show {
    display: flex;
  }
  .info-box {
    background: rgba(18,18,26,0.95);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 24px 32px;
    text-align: center;
    animation: infoIn 0.25s ease;
  }
  @keyframes infoIn {
    from { opacity: 0; transform: scale(0.92); }
    to   { opacity: 1; transform: scale(1); }
  }
  .info-box .info-label {
    font-size: 13px;
    color: #888;
    margin-bottom: 6px;
  }
  .info-box .info-name {
    font-size: 18px;
    color: #fff;
    font-weight: 600;
    letter-spacing: 1px;
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<button class="toggle-btn" id="toggleBtn" title="收起/展开面板">☰</button>

<div class="control-panel" id="panel">
  <div class="panel-title">发光格子生成器【老黑】</div>

  <div>
    <div class="param-label" style="margin-bottom:6px"><span>快速预设</span></div>
    <div class="preset-group">
      <button class="preset-btn" data-preset="fine">细密格子</button>
      <button class="preset-btn" data-preset="medium">标准格子</button>
      <button class="preset-btn" data-preset="large">大格子</button>
      <button class="preset-btn" data-preset="glow">强发光</button>
    </div>
  </div>

  <div class="divider"></div>

  <div class="color-row">
    <div class="color-pick">
      <label>背景颜色</label>
      <input type="color" id="bgColor" value="#000000">
    </div>
    <div class="color-pick">
      <label>线条颜色</label>
      <input type="color" id="lineColor" value="#ffffff">
    </div>
  </div>

  <div class="param-group">
    <div class="param-item">
      <div class="param-label">
        <span>格子大小</span>
        <span class="param-value" id="val-gridSize">240</span>
      </div>
      <input type="range" id="gridSize" min="40" max="600" value="240" step="1">
    </div>
    <div class="param-item">
      <div class="param-label">
        <span>发光强度</span>
        <span class="param-value" id="val-glowStrength">8</span>
      </div>
      <input type="range" id="glowStrength" min="0" max="30" value="8" step="1">
    </div>
    <div class="param-item">
      <div class="param-label">
        <span>线条透明度</span>
        <span class="param-value" id="val-lineAlpha">0.45</span>
      </div>
      <input type="range" id="lineAlpha" min="0.05" max="1" value="0.45" step="0.01">
    </div>
    <div class="param-item">
      <div class="param-label">
        <span>光晕透明度</span>
        <span class="param-value" id="val-glowAlpha">0.20</span>
      </div>
      <input type="range" id="glowAlpha" min="0.02" max="0.6" value="0.20" step="0.01">
    </div>
    <div class="param-item">
      <div class="param-label">
        <span>线条宽度</span>
        <span class="param-value" id="val-lineWidth">1.0</span>
      </div>
      <input type="range" id="lineWidth" min="0.5" max="4" value="1" step="0.1">
    </div>
    <div class="param-item">
      <div class="param-label">
        <span>运动速度</span>
        <span class="param-value" id="val-speed">1.0x</span>
      </div>
      <input type="range" id="speed" min="0.2" max="4" value="1" step="0.1">
    </div>
    <div class="param-item">
      <div class="param-label">
        <span>交叉点大小</span>
        <span class="param-value" id="val-dotRadius">2.0</span>
      </div>
      <input type="range" id="dotRadius" min="0" max="6" value="2" step="0.1">
    </div>
  </div>

  <div class="param-item">
    <div class="param-label"><span>运动方向</span></div>
    <div class="direction-group">
      <button class="direction-btn" data-dir="up">↑ 上</button>
      <button class="direction-btn active" data-dir="down">↓ 下</button>
      <button class="direction-btn" data-dir="left">← 左</button>
      <button class="direction-btn" data-dir="right">→ 右</button>
    </div>
  </div>

  <div class="divider"></div>

  <div class="param-group">
    <div class="param-label" style="display:flex;justify-content:space-between;align-items:center">
      <span>文字</span>
      <label class="checkbox-row"><input type="checkbox" id="writeText" checked> 写文字</label>
    </div>
    <textarea class="text-input" id="textInput" rows="2">HEIP</textarea>
    <div class="param-label"><span>字体名</span></div>
    <input type="text" class="text-input" id="fontInput" value="sans-serif" placeholder="如 楷体 / 仿宋 / Arial">
    <label class="font-file-btn" for="fontFile">＋ 加载本地字体 .ttf/.otf</label>
    <input type="file" id="fontFile" accept=".ttf,.otf" style="display:none">
    <div class="param-item">
      <div class="param-label"><span>字号</span><span class="param-value" id="val-textSize">300</span></div>
      <input type="range" id="textSize" min="20" max="600" value="300" step="1">
    </div>
    <div class="color-row">
      <div class="color-pick"><label>字色</label><input type="color" id="textColor" value="#ffffff"></div>
    </div>
  </div>

  <div class="divider"></div>

  <button class="save-btn" id="resetBtn" style="background: linear-gradient(135deg, #ef4444, #f97316); margin-bottom: 0;">重置参数</button>
  <button class="save-btn" id="saveBtn">保存图片</button>
</div>

<!-- 底部引流链接 -->
<div class="bottom-links" id="bottomLinks">
  <button class="link-icon" id="wechatBtn" title="公众号：黑白间设计">
    <svg viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>
  </button>
  <a class="link-icon" href="https://space.bilibili.com/76949949" target="_blank" title="B站：黑白间设计">
    <svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="14" rx="3"/><path d="M9 2l3 4M15 2l-3 4"/><circle cx="9" cy="13" r="1.2"/><circle cx="15" cy="13" r="1.2"/></svg>
  </a>
  <a class="link-icon h-letter" href="https://pan.quark.cn/s/3fdb856606ad" target="_blank" title="HEIP插件下载">H</a>
  <button class="link-icon arrow-btn" id="hideLinksBtn" title="收起">
    <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
  </button>
</div>

<!-- 收起后显示的展开按钮 -->
<button class="bottom-expand" id="showLinksBtn" title="展开">
  <svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg>
</button>

<!-- 公众号信息弹窗 -->
<div class="info-modal" id="infoModal">
  <div class="info-box">
    <div class="info-label">微信公众号</div>
    <div class="info-name">黑白间设计</div>
  </div>
</div>

<script>
// ── 参数 ──
const params = {
  gridSize: 240,
  glowStrength: 8,
  lineAlpha: 0.45,
  glowAlpha: 0.20,
  lineWidth: 1,
  speed: 1,
  dotRadius: 2,
  direction: 'down',
  bgColor: '#000000',
  lineColor: '#ffffff',
  writeText: true,
  text: 'HEIP',
  fontName: 'sans-serif',
  textSize: 300,
  textColor: '#ffffff',
};

// ── localStorage 持久化 ──
const LS_PREFIX = 'glowgrid_';
function persistCfg(key, value) {
  try { localStorage.setItem(LS_PREFIX + key, String(value)); } catch(e) {}
}
function restoreCfg() {
  const keys = ['gridSize','glowStrength','lineAlpha','glowAlpha','lineWidth','speed','dotRadius','direction','bgColor','lineColor','writeText','text','fontName','textSize','textColor'];
  for (const k of keys) {
    const v = localStorage.getItem(LS_PREFIX + k);
    if (v === null) continue;
    if (k === 'writeText') params[k] = v === 'true';
    else if (k === 'gridSize' || k === 'glowStrength' || k === 'textSize') params[k] = parseInt(v);
    else if (k === 'lineAlpha' || k === 'glowAlpha' || k === 'lineWidth' || k === 'speed' || k === 'dotRadius') params[k] = parseFloat(v);
    else params[k] = v;
  }
  // 恢复自定义字体
  const fontDataUrl = localStorage.getItem(LS_PREFIX + 'fontDataUrl');
  if (fontDataUrl) {
    try {
      const base64 = fontDataUrl.split(',')[1];
      const binary = atob(base64);
      const len = binary.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) bytes[i] = binary.charCodeAt(i);
      const ff = new FontFace('customFont', bytes.buffer);
      ff.load().then(() => {
        document.fonts.add(ff);
      }).catch(err => console.error('字体恢复失败', err));
    } catch(e) { console.error('字体恢复失败', e); }
  }
  syncUIFromCfg();
}
function syncUIFromCfg() {
  // 滑块 + 数值标签
  const sliderConfigs = [
    { id: 'gridSize',      fmt: v => v },
    { id: 'glowStrength',  fmt: v => v },
    { id: 'lineAlpha',     fmt: v => v.toFixed(2) },
    { id: 'glowAlpha',     fmt: v => v.toFixed(2) },
    { id: 'lineWidth',     fmt: v => v.toFixed(1) },
    { id: 'speed',         fmt: v => v.toFixed(1) + 'x' },
    { id: 'dotRadius',     fmt: v => v.toFixed(1) },
    { id: 'textSize',      fmt: v => v },
  ];
  sliderConfigs.forEach(function(cfg) {
    var slider = document.getElementById(cfg.id);
    var valEl = document.getElementById('val-' + cfg.id);
    if (slider) slider.value = params[cfg.id];
    if (valEl) valEl.textContent = cfg.fmt(params[cfg.id]);
  });
  // 颜色选择器
  document.getElementById('bgColor').value = params.bgColor;
  document.getElementById('lineColor').value = params.lineColor;
  document.getElementById('textColor').value = params.textColor;
  // 方向按钮
  document.querySelectorAll('.direction-btn').forEach(function(b) {
    b.classList.toggle('active', b.dataset.dir === params.direction);
  });
  // 文字控件
  document.getElementById('writeText').checked = params.writeText;
  document.getElementById('textInput').value = params.text;
  document.getElementById('fontInput').value = params.fontName;
}

// ── Canvas 全屏 ──
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let animFrame = null;
let frameCount = 0;

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function renderFrame(targetCtx, w, h, frame) {
  const { gridSize, glowStrength, lineAlpha, glowAlpha, lineWidth, speed, dotRadius, direction, bgColor, lineColor, writeText, text, fontName, textSize, textColor } = params;

  // 解析线条颜色为RGB
  const lr = parseInt(lineColor.slice(1,3),16);
  const lg = parseInt(lineColor.slice(3,5),16);
  const lb = parseInt(lineColor.slice(5,7),16);

  targetCtx.fillStyle = bgColor;
  targetCtx.fillRect(0, 0, w, h);

  const cycleFrames = Math.max(1, Math.round(gridSize / speed));
  const offset = (frame % cycleFrames) * speed;

  // 初始偏移：让第一条纵线移出画面左侧（半个格子宽度）
  const padX = gridSize / 2;

  let offX = -padX, offY = 0;
  if (direction === 'up') offY = -offset;
  else if (direction === 'down') offY = offset;
  else if (direction === 'left') offX = -padX - offset;
  else if (direction === 'right') offX = -padX + offset;

  const cols = Math.ceil(w / gridSize) + 3;
  const rows = Math.ceil(h / gridSize) + 3;

  if (glowStrength > 0) {
    targetCtx.save();
    targetCtx.shadowColor = `rgba(${lr},${lg},${lb},${glowAlpha})`;
    targetCtx.shadowBlur = glowStrength;
    targetCtx.strokeStyle = `rgba(${lr},${lg},${lb},${glowAlpha})`;
    targetCtx.lineWidth = lineWidth + 2;
    for (let i = -1; i < cols; i++) {
      const x = i * gridSize + offX;
      targetCtx.beginPath(); targetCtx.moveTo(x, 0); targetCtx.lineTo(x, h); targetCtx.stroke();
    }
    for (let j = -1; j < rows; j++) {
      const y = j * gridSize + offY;
      targetCtx.beginPath(); targetCtx.moveTo(0, y); targetCtx.lineTo(w, y); targetCtx.stroke();
    }
    targetCtx.restore();
  }

  targetCtx.strokeStyle = `rgba(${lr},${lg},${lb},${lineAlpha})`;
  targetCtx.lineWidth = lineWidth;
  for (let i = -1; i < cols; i++) {
    const x = i * gridSize + offX;
    targetCtx.beginPath(); targetCtx.moveTo(x, 0); targetCtx.lineTo(x, h); targetCtx.stroke();
  }
  for (let j = -1; j < rows; j++) {
    const y = j * gridSize + offY;
    targetCtx.beginPath(); targetCtx.moveTo(0, y); targetCtx.lineTo(w, y); targetCtx.stroke();
  }

  if (dotRadius > 0) {
    targetCtx.fillStyle = `rgba(${lr},${lg},${lb},${Math.min(1, lineAlpha + 0.2)})`;
    for (let i = -1; i < cols; i++) {
      for (let j = -1; j < rows; j++) {
        const cx = i * gridSize + offX;
        const cy = j * gridSize + offY;
        if (cx > -gridSize && cx < w + gridSize && cy > -gridSize && cy < h + gridSize) {
          targetCtx.beginPath(); targetCtx.arc(cx, cy, dotRadius, 0, Math.PI * 2); targetCtx.fill();
        }
      }
    }
  }

  // 画文字（居中）
  if (writeText && text) {
    targetCtx.save();
    targetCtx.fillStyle = textColor;
    targetCtx.font = `bold ${textSize}px ${fontName}, sans-serif`;
    targetCtx.textAlign = 'center';
    targetCtx.textBaseline = 'middle';
    targetCtx.fillText(text, w / 2, h / 2);
    targetCtx.restore();
  }
}

function animate() {
  renderFrame(ctx, canvas.width, canvas.height, frameCount);
  frameCount++;
  animFrame = requestAnimationFrame(animate);
}

// ── 颜色选择器 ──
document.getElementById('bgColor').addEventListener('input', (e) => {
  params.bgColor = e.target.value;
  persistCfg('bgColor', params.bgColor);
});
document.getElementById('lineColor').addEventListener('input', (e) => {
  params.lineColor = e.target.value;
  persistCfg('lineColor', params.lineColor);
});

// ── 面板收起/展开 ──
const panel = document.getElementById('panel');
const toggleBtn = document.getElementById('toggleBtn');
let panelOpen = true;

toggleBtn.addEventListener('click', () => {
  panelOpen = !panelOpen;
  panel.classList.toggle('collapsed', !panelOpen);
  toggleBtn.textContent = panelOpen ? '✕' : '☰';
});

// ── 控件绑定 ──
const sliderIds = ['gridSize', 'glowStrength', 'lineAlpha', 'glowAlpha', 'lineWidth', 'speed', 'dotRadius'];
sliderIds.forEach(id => {
  const slider = document.getElementById(id);
  const valEl = document.getElementById('val-' + id);
  slider.addEventListener('input', () => {
    const v = parseFloat(slider.value);
    params[id] = v;
    if (id === 'speed') valEl.textContent = v.toFixed(1) + 'x';
    else if (id === 'gridSize' || id === 'glowStrength') valEl.textContent = v;
    else if (id === 'lineWidth' || id === 'dotRadius') valEl.textContent = v.toFixed(1);
    else valEl.textContent = v.toFixed(2);
    persistCfg(id, v);
  });
});

document.querySelectorAll('.direction-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.direction-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    params.direction = btn.dataset.dir;
    persistCfg('direction', params.direction);
  });
});

// ── 文字控件 ──
document.getElementById('writeText').addEventListener('change', (e) => { params.writeText = e.target.checked; persistCfg('writeText', params.writeText); });
document.getElementById('textInput').addEventListener('input', (e) => { params.text = e.target.value; persistCfg('text', params.text); });
document.getElementById('fontInput').addEventListener('input', (e) => { params.fontName = e.target.value; persistCfg('fontName', params.fontName); });
document.getElementById('textSize').addEventListener('input', (e) => {
  params.textSize = parseInt(e.target.value);
  document.getElementById('val-textSize').textContent = params.textSize;
  persistCfg('textSize', params.textSize);
});
document.getElementById('textColor').addEventListener('input', (e) => { params.textColor = e.target.value; persistCfg('textColor', params.textColor); });
document.getElementById('fontFile').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const ff = new FontFace('customFont', ev.target.result);
    ff.load().then(() => {
      document.fonts.add(ff);
      params.fontName = 'customFont';
      document.getElementById('fontInput').value = 'customFont';
      persistCfg('fontName', 'customFont');
      // 持久化字体文件为 base64 dataURL
      try {
        const bytes = new Uint8Array(ev.target.result);
        let binary = '';
        const chunk = 0x8000;
        for (let i = 0; i < bytes.length; i += chunk) {
          binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
        }
        const b64 = btoa(binary);
        const mime = file.type || 'font/ttf';
        persistCfg('fontDataUrl', 'data:' + mime + ';base64,' + b64);
      } catch(err) { console.error('字体持久化失败', err); }
    }).catch(err => console.error('字体加载失败', err));
  };
  reader.readAsArrayBuffer(file);
  e.target.value = '';
});

const presets = {
  fine:   { gridSize: 60,  glowStrength: 4,  lineAlpha: 0.35, glowAlpha: 0.15, lineWidth: 0.5, speed: 0.8, dotRadius: 1 },
  medium: { gridSize: 160, glowStrength: 6,  lineAlpha: 0.45, glowAlpha: 0.20, lineWidth: 1,   speed: 1,   dotRadius: 2 },
  large:  { gridSize: 360, glowStrength: 10, lineAlpha: 0.50, glowAlpha: 0.25, lineWidth: 1.5, speed: 1.5, dotRadius: 3 },
  glow:   { gridSize: 200, glowStrength: 20, lineAlpha: 0.30, glowAlpha: 0.45, lineWidth: 1,   speed: 0.6, dotRadius: 2.5 },
};
document.querySelectorAll('.preset-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const p = presets[btn.dataset.preset];
    Object.assign(params, p);
    sliderIds.forEach(id => {
      const slider = document.getElementById(id);
      const valEl = document.getElementById('val-' + id);
      slider.value = params[id];
      if (id === 'speed') valEl.textContent = params[id].toFixed(1) + 'x';
      else if (id === 'gridSize' || id === 'glowStrength') valEl.textContent = params[id];
      else if (id === 'lineWidth' || id === 'dotRadius') valEl.textContent = params[id].toFixed(1);
      else valEl.textContent = params[id].toFixed(2);
    });
    // 持久化所有预设参数
    sliderIds.forEach(id => persistCfg(id, params[id]));
  });
});

// ── 保存图片（弹出另存为对话框）──
document.getElementById('saveBtn').addEventListener('click', async () => {
  const W = canvas.width;
  const H = canvas.height;

  const offCanvas = document.createElement('canvas');
  offCanvas.width = W;
  offCanvas.height = H;
  const offCtx = offCanvas.getContext('2d');
  offCtx.drawImage(canvas, 0, 0);

  const blob = await new Promise(resolve => offCanvas.toBlob(resolve, 'image/png'));

  // 尝试使用系统另存为对话框
  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName: `glow-grid-${W}x${H}.png`,
        types: [{
          description: 'PNG 图片',
          accept: { 'image/png': ['.png'] }
        }]
      });
      const writable = await handle.createWritable();
      await writable.write(blob);
      await writable.close();
    } catch (e) {
      if (e.name !== 'AbortError') console.error(e);
    }
  } else {
    // 回退：直接下载
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `glow-grid-${W}x${H}.png`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }
});

// ── 底部引流栏逻辑 ──
const bottomLinks = document.getElementById('bottomLinks');
const hideLinksBtn = document.getElementById('hideLinksBtn');
const showLinksBtn = document.getElementById('showLinksBtn');

hideLinksBtn.addEventListener('click', () => {
  bottomLinks.classList.add('hidden');
  showLinksBtn.classList.add('visible');
});

showLinksBtn.addEventListener('click', () => {
  bottomLinks.classList.remove('hidden');
  showLinksBtn.classList.remove('visible');
});

// ── 公众号弹窗 ──
const infoModal = document.getElementById('infoModal');
document.getElementById('wechatBtn').addEventListener('click', () => {
  infoModal.classList.add('show');
});
infoModal.addEventListener('click', (e) => {
  if (e.target === infoModal) infoModal.classList.remove('show');
});

// ── 重置参数 ──
document.getElementById('resetBtn').addEventListener('click', () => {
  const defaults = {
    gridSize: 240, glowStrength: 8, lineAlpha: 0.45, glowAlpha: 0.20,
    lineWidth: 1, speed: 1, dotRadius: 2, direction: 'down',
    bgColor: '#000000', lineColor: '#ffffff', writeText: true,
    text: 'HEIP', fontName: 'sans-serif', textSize: 300, textColor: '#ffffff',
  };
  Object.assign(params, defaults);
  // 清除 localStorage 中的参数
  const keys = ['gridSize','glowStrength','lineAlpha','glowAlpha','lineWidth','speed','dotRadius','direction','bgColor','lineColor','writeText','text','fontName','textSize','textColor','fontDataUrl'];
  keys.forEach(k => { try { localStorage.removeItem(LS_PREFIX + k); } catch(e) {} });
  syncUIFromCfg();
});

// ── 启动 ──
restoreCfg();
animate();
</script>

<style>
body.hide-all-ui .control-panel,
body.hide-all-ui .toggle-btn,
body.hide-all-ui .bottom-links,
body.hide-all-ui .bottom-expand,
body.hide-all-ui .info-modal {
  display: none !important;
}
#hide-ui-hotzone {
  position: fixed; top: 0; right: 0;
  width: 28px; height: 28px;
  z-index: 9998; opacity: 0;
  display: none;
}
body.hide-all-ui #hide-ui-hotzone { display: block; }
#hide-ui-label {
  position: fixed; bottom: 34px; left: 12px;
  color: #bbb;
  font-size: 12px;
  font-family: -apple-system, "PingFang SC", sans-serif;
  cursor: pointer; z-index: 9999;
  user-select: none;
  transition: color 0.2s, background 0.2s;
  background: rgba(0,0,0,0.4);
  border: none; padding: 5px 10px;
  border-radius: 4px;
  outline: none;
  text-shadow: 0 1px 3px rgba(0,0,0,0.7);
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
}
#hide-ui-label:hover { color: #6366f1; background: rgba(99,102,241,0.2); }
body.hide-all-ui #hide-ui-label { display: none; }
#hide-ui-toast {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  background: rgba(18,18,26,0.92); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  color: #fff; padding: 14px 22px; border-radius: 10px;
  font-size: 14px; font-family: -apple-system, "PingFang SC", sans-serif;
  z-index: 9999; opacity: 0; pointer-events: none;
  transition: opacity 0.3s; border: 1px solid rgba(99,102,241,0.4);
  max-width: 80vw; text-align: center;
}
#hide-ui-toast.show { opacity: 1; }
</style>
<div id="hide-ui-hotzone"></div>
<button id="hide-ui-label">隐藏控制台</button>
<div id="hide-ui-toast"></div>
<script>
(function(){
  var STORE = 'laohei-hide-ui';
  var hk = document.getElementById('hide-ui-hotzone');
  var label = document.getElementById('hide-ui-label');
  var toast = document.getElementById('hide-ui-toast');
  var toastTimer = null;
  function applyHidden(hidden){
    document.body.classList.toggle('hide-all-ui', hidden);
    if(hk){ hk.style.pointerEvents = 'none'; if(hidden) setTimeout(function(){ hk.style.pointerEvents = 'auto'; }, 400); }
  }
  function showToast(msg){
    if(!toast) return;
    toast.textContent = msg;
    toast.classList.add('show');
    if(toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.classList.remove('show'); }, 2200);
  }
  function hide(){
    applyHidden(true);
    try{ localStorage.setItem(STORE, '1'); }catch(e){}
    showToast('UI 已隐藏 · 再按 Ctrl+Shift+` 或鼠标移到右上角唤回');
  }
  function show(){
    applyHidden(false);
    try{ localStorage.removeItem(STORE); }catch(e){}
    showToast('UI 已显示');
  }
  function toggle(){
    if(document.body.classList.contains('hide-all-ui')) show();
    else hide();
  }
  try{
    if(localStorage.getItem(STORE) === '1') applyHidden(true);
  }catch(e){}
  document.addEventListener('keydown', function(e){
    if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
    if((e.ctrlKey||e.metaKey) && e.shiftKey && (e.key==='`' || e.key==='~')){
      e.preventDefault();
      toggle();
    }
  });
  if(hk){
    hk.addEventListener('mouseenter', function(){
      if(document.body.classList.contains('hide-all-ui')) show();
    });
  }
  if(label){
    label.addEventListener('click', function(){
      if(!document.body.classList.contains('hide-all-ui')) hide();
    });
  }
})();
</script>
<!-- /hide-ui-v2 -->
</body>
